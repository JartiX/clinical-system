# nginx на хосте: принимает порт 90 и передаёт запросы веб-интерфейсу в Docker
# (docker-compose.yml публикует его только на 127.0.0.1:WEB_PORT, по умолчанию 5173).
#
# Установка:
#   sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/clinical-system
#   sudo ln -s /etc/nginx/sites-available/clinical-system /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# На RHEL/CentOS вместо sites-available — /etc/nginx/conf.d/clinical-system.conf.

server {
    listen 90;
    listen [::]:90;
    server_name _;

    # загрузка файлов пациента
    client_max_body_size 50m;

    # Авторизации в приложении пока нет — пускать только по паролю:
    #   sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/.htpasswd-clinical <логин>
    auth_basic "clinical-system";
    auth_basic_user_file /etc/nginx/.htpasswd-clinical;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
