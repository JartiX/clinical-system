[project]
name = "clinical-system"
version = "0.1.0"
description = "Clinical reasoning support system: patient graph storage (M1) and document ingestion (M2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "rdflib>=7.0",
    "pyshacl>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["rdf/*.ttl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
